<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>first-embabel · 自我进化 Agent Demo</title>
<style>
  :root { --bg:#f5f6f8; --mine:#1f6feb; --mine-text:#fff; --border:#e4e7ec; --text:#1f2328; --muted:#656d76; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px 150px; }
  header h1 { font-size:20px; margin:8px 0 4px; }
  header p { color:var(--muted); font-size:13px; margin:0 0 16px; }
  #chat { display:flex; flex-direction:column; gap:12px; }
  .msg { display:flex; }
  .msg.user { justify-content:flex-end; }
  .bubble { max-width:78%; padding:10px 14px; border-radius:12px; line-height:1.6; font-size:14px; white-space:pre-wrap; word-break:break-word; }
  .msg.user .bubble { background:var(--mine); color:var(--mine-text); border-bottom-right-radius:4px; }
  .msg.bot .bubble { background:#fff; border:1px solid var(--border); border-bottom-left-radius:4px; }
  .meta { margin-top:8px; font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px; }
  .tag { background:#eef2f8; border-radius:10px; padding:2px 10px; }
  .tag.mem { background:#e6f4ea; color:#1a7f37; }
  .tag.new { background:#fff4e5; color:#b35900; }
  .dock { position:fixed; left:0; right:0; bottom:0; background:rgba(245,246,248,.95); border-top:1px solid var(--border); padding:12px 16px; }
  .dock-inner { max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
  .hints { display:flex; gap:8px; flex-wrap:wrap; }
  .hint { font-size:12px; color:var(--muted); background:#fff; border:1px solid var(--border); border-radius:14px; padding:4px 12px; cursor:pointer; }
  .hint:hover { border-color:var(--mine); color:var(--mine); }
  form { display:flex; gap:8px; }
  input { flex:1; border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:14px; outline:none; background:#fff; }
  input:focus { border-color:var(--mine); }
  button { border:none; background:var(--mine); color:#fff; border-radius:10px; padding:10px 20px; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .thinking { color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>first-embabel</h1>
    <p>基于 Embabel 的自我进化 Agent demo：相同问题再次提问时命中记忆、跳过 LLM 规划，可对比两次回答下方的「LLM 调用次数」。</p>
  </header>
  <div id="chat"></div>
</div>
<div class="dock">
  <div class="dock-inner">
    <div class="hints">
      <span class="hint" onclick="ask('我是谁')">我是谁</span>
      <span class="hint" onclick="ask('我所在的部门是哪个？我所在部门都有哪些员工？')">我所在的部门及员工</span>
    </div>
    <form onsubmit="return submitForm(event)">
      <input id="input" placeholder="输入问题，回车发送…" autocomplete="off">
      <button id="send" type="submit">发送</button>
    </form>
  </div>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function addMsg(side, html) {
  const div = document.createElement('div');
  div.className = 'msg ' + side;
  div.innerHTML = '<div class="bubble">' + html + '</div>';
  chat.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
  return div;
}

async function ask(text) {
  input.value = '';
  addMsg('user', esc(text));
  const pending = addMsg('bot', '<span class="thinking">思考中（可能需要数秒）…</span>');
  send.disabled = true;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text})
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    let meta = '<div class="meta">';
    meta += '<span class="tag ' + (data.fromMemory ? 'mem' : 'new') + '">' + (data.fromMemory ? '记忆命中' : '首次执行') + '</span>';
    meta += '<span class="tag">LLM 调用 × ' + data.llmCalls + '</span>';
    if (data.executedTools && data.executedTools.length) {
      meta += '<span class="tag">工具: ' + data.executedTools.map(t => t.name).join(', ') + '</span>';
    }
    meta += '</div>';
    pending.querySelector('.bubble').innerHTML = esc(data.answer).replace(/\n/g, '<br>') + meta;
  } catch (e) {
    pending.querySelector('.bubble').innerHTML = '请求失败: ' + esc(e.message || e);
  } finally {
    send.disabled = false;
    input.focus();
  }
}

function submitForm(e) {
  e.preventDefault();
  const text = input.value.trim();
  if (text) ask(text);
  return false;
}
</script>
</body>
</html>
